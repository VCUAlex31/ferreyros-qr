<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector QR - Ferreyros</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a365d;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; padding: 16px;
    }
    .card {
      background: white; border-radius: 14px;
      padding: 20px; width: 100%; max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .titulo {
      text-align: center; color: #1a365d;
      font-size: 15px; font-weight: 700;
      margin-bottom: 14px; letter-spacing: 0.5px;
    }
    #qr-reader { width: 100%; border-radius: 10px; overflow: hidden; border: 2px dashed #2a4a7f; }
    .estado {
      margin-top: 12px; padding: 10px 14px;
      border-radius: 8px; font-size: 13px; font-weight: 500;
      text-align: center; display: none;
    }
    .est-ok  { background: #d1e7dd; color: #0a3622; }
    .est-err { background: #f8d7da; color: #58151c; }
    .est-inf { background: #cfe2ff; color: #084298; display: flex !important; align-items: center; justify-content: center; gap: 8px; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(8,66,152,0.3); border-top-color: #084298; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .resultado {
      margin-top: 12px; background: #f0f9ff;
      border: 1px solid #bae6fd; border-radius: 10px;
      padding: 14px; display: none;
    }
    .res-fila { display: flex; gap: 8px; margin-bottom: 8px; }
    .res-lbl  { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 2px; }
    .res-val  { font-size: 14px; font-weight: 700; color: #1a365d; word-break: break-all; }
    .res-item { flex: 1; }
    .btn-nuevo {
      width: 100%; margin-top: 10px; padding: 10px;
      background: #1a365d; color: white; border: none;
      border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer;
    }
    .btn-nuevo:hover { background: #2a4a7f; }
    .raw { font-size: 11px; color: #888; margin-top: 6px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <div class="titulo">📷 FERREYROS — Lector QR</div>
    <div id="qr-reader"></div>
    <div class="estado est-inf" id="est-ini" style="display:flex">
      <div class="spinner"></div> Iniciando cámara...
    </div>
    <div class="estado est-ok"  id="est-ok"></div>
    <div class="estado est-err" id="est-err"></div>
    <div class="resultado" id="resultado">
      <div class="res-fila">
        <div class="res-item">
          <div class="res-lbl">N° Pedido</div>
          <div class="res-val" id="r-pedido">—</div>
        </div>
        <div class="res-item">
          <div class="res-lbl">Cliente</div>
          <div class="res-val" id="r-cliente">—</div>
        </div>
      </div>
      <div class="res-lbl">Dato crudo del QR</div>
      <div class="raw" id="r-raw"></div>
      <button class="btn-nuevo" onclick="reiniciar()">↺ Escanear otro QR</button>
    </div>
  </div>

  <script>
    var html5QrCode = null;
    var escaneado   = false;

    // Origen del Apps Script — CAMBIA ESTO por la URL de tu Web App
    // Acepta cualquier origen de google (más seguro que '*')
    var TARGET_ORIGIN = 'https://script.google.com';

    function iniciar() {
      escaneado = false;
      document.getElementById('resultado').style.display = 'none';
      show('est-ini', '');
      hide('est-ok'); hide('est-err');

      if (html5QrCode) {
        html5QrCode.stop().catch(function(){}).finally(function(){ arrancar(); });
      } else {
        html5QrCode = new Html5Qrcode("qr-reader");
        arrancar();
      }
    }

    function arrancar() {
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 12, qrbox: { width: 230, height: 230 } },
        onQR,
        function(){}
      ).then(function(){
        hide('est-ini');
      }).catch(function(err){
        hide('est-ini');
        show('est-err', '❌ Sin acceso a la cámara: ' + err);
      });
    }

    function onQR(texto) {
      if (escaneado) return;
      escaneado = true;
      html5QrCode.stop().catch(function(){});

      var pedido = '', cliente = '';
      try {
        var obj = JSON.parse(texto);
        pedido  = obj.pedido  || obj.PEDIDO  || obj.nroPedido   || '';
        cliente = obj.cliente || obj.CLIENTE || obj.razonSocial || '';
      } catch(e) {
        texto.split('|').forEach(function(p){
          var kv = p.split(':');
          if (!kv[1]) return;
          var k = kv[0].trim().toUpperCase();
          var v = kv.slice(1).join(':').trim();
          if (k==='PEDIDO'||k==='NRO_PEDIDO')    pedido  = v;
          if (k==='CLIENTE'||k==='RAZON_SOCIAL') cliente = v;
        });
        // Si el QR no tiene estructura conocida, manda el texto completo como pedido
        if (!pedido && !cliente) pedido = texto;
      }

      document.getElementById('r-pedido').textContent  = pedido  || '—';
      document.getElementById('r-cliente').textContent = cliente || '—';
      document.getElementById('r-raw').textContent     = texto;
      document.getElementById('resultado').style.display = 'block';
      show('est-ok', '✔ QR leído — enviando a Vigilancia...');

      // ── Enviar al Apps Script vía postMessage ──────────────
      var payload = { tipo: 'QR_FERREYROS', pedido: pedido, cliente: cliente, raw: texto };
      // Intenta enviar al parent (si está en iframe)
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, '*');
      }
      // También abre el intent en móvil por si acaso
      // (el Apps Script escucha en el iframe)
    }

    function reiniciar() {
      escaneado = false;
      document.getElementById('resultado').style.display = 'none';
      hide('est-ok'); hide('est-err');
      iniciar();
    }

    function show(id, msg) {
      var el = document.getElementById(id);
      if (msg !== '') el.textContent = msg;
      el.style.display = 'block';
    }
    function hide(id) { document.getElementById(id).style.display = 'none'; }

    // Arrancar al cargar
    iniciar();
  </script>
</body>
</html>
